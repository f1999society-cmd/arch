# bnasec live — sshd is a control channel, not an attack surface:
# public-key authentication ONLY, and the shipped ISO has NO keys installed
# (bnasec-sshd-key.service installs one only when the boot command line
# explicitly asks for it via bnasec.sshkey="...").
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
X11Forwarding no
