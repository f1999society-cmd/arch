# last-resort fallback: if sddm ever fails to bring up HyDE, the physical
# console drops into an autologin shell instead of a dead black screen.
# sddm conflicts/stops this unit when it starts — both paths can't collide.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \u' --noclear --autologin bna %I $TERM
