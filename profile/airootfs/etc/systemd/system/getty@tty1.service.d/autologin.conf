# bnasec: physical console autologins as bna; .zprofile then starts Hyprland
# on tty1 only — other ttys keep a normal login shell.
#
# v3.0.0: DO NOT use the '-o "-p -- \u"' form here — passing the username as a
# login(1) argument makes login run a NORMAL authenticated login and the
# console sits at 'Password:' forever (proven by the v3.0.0 CI run: the tty1
# screenshot showed the password prompt while the serial console — which uses
# plain '--autologin' — was already in a shell). Plain --autologin lets agetty
# exec login with -f (pre-authenticated): boot -> desktop, zero interaction.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin bna --noclear %I $TERM
