title    bnasec HyDE — verbose boot (debug serial)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisolabel=BNASEC_120 cow_label=persistence cow_directory=persist console=tty0 console=ttyS0,115200n8 ignore_loglevel
