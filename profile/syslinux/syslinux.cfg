SERIAL 0 115200
UI vesamenu.c32
MENU TITLE bnasec Arch 3.0.0 — Hyprland + ML4W
MENU BACKGROUND splash.png
TIMEOUT 50

MENU WIDTH 72
MENU MARGIN 4
MENU ROWS 7
MENU VSHIFT 8
MENU TABMSGROW 13
MENU CMDLINEROW 13
MENU HELPMSGROW 15
MENU HELPMSGENDROW 27

MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ccff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #30ffffff #00000000 std

MENU CLEAR
MENU IMMEDIATE

DEFAULT persistent
LABEL persistent
MENU LABEL bnasec ML4W — persistent (installs survive reboot)
TEXT HELP
Full persistence: root runs as an overlay whose changes AND your
files live on the stick's ext4 data partition (auto-created on
first boot). Packages you install survive reboots. Firefox data,
settings and config persist too.
ENDTEXT
KERNEL /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=BNASEC300 cow_label=persistence quiet loglevel=3 console=tty0 console=ttyS0,115200n8

LABEL dataonly
MENU LABEL bnasec ML4W — data-only persistence (root resets)
TEXT HELP
Same stick data partition for Firefox/config/files, but the root
resets to ISO state every boot (v2.0.x behavior — use this if a
root change ever breaks the persistent boot).
ENDTEXT
KERNEL /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=BNASEC300 quiet loglevel=3 console=tty0 console=ttyS0,115200n8

LABEL ram
MENU LABEL bnasec ML4W — RAM-only session (nothing persists)
TEXT HELP
Boot entirely from RAM. Nothing is read from or written to the
persistence partition.
ENDTEXT
KERNEL /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=BNASEC300 bnasec_nopersist quiet loglevel=3 console=tty0 console=ttyS0,115200n8

LABEL debug
MENU LABEL verbose boot (debug serial)
TEXT HELP
Persistent boot with full kernel logging on the serial console.
ENDTEXT
KERNEL /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=BNASEC300 cow_label=persistence console=tty0 console=ttyS0,115200n8 ignore_loglevel

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32
