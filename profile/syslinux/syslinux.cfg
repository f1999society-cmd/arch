SERIAL 0 115200
UI vesamenu.c32
MENU TITLE bnasec Arch 1.2.0 — HyDE
MENU BACKGROUND splash.png
TIMEOUT 50

MENU WIDTH 72
MENU MARGIN 4
MENU ROWS 6
MENU VSHIFT 8
MENU TABMSGROW 12
MENU CMDLINEROW 12
MENU HELPMSGROW 14
MENU HELPMSGENDROW 26

MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ccff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #30ffffff #00000000 std

MENU CLEAR
MENU IMMEDIATE

DEFAULT persistent
LABEL persistent
MENU LABEL bnasec HyDE — persistent
TEXT HELP
Boot with USB persistence. First boot creates a persistence
partition on the stick automatically (ext4, full capacity).
Everything you change survives reboots.
ENDTEXT
KERNEL /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=BNASEC_120 cow_label=persistence cow_directory=persist quiet loglevel=3 console=ttyS0,115200n8

LABEL ram
MENU LABEL bnasec HyDE — RAM-only session (no persistence)
TEXT HELP
Boot entirely from RAM. Nothing is written to the stick.
ENDTEXT
KERNEL /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=BNASEC_120 quiet loglevel=3 console=ttyS0,115200n8

LABEL debug
MENU LABEL verbose boot (debug serial)
TEXT HELP
Persistent boot with full kernel logging on the serial console.
ENDTEXT
KERNEL /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=BNASEC_120 cow_label=persistence cow_directory=persist console=ttyS0,115200n8 ignore_loglevel

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32
