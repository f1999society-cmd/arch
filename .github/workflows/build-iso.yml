name: build-bnasec-iso

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "skip QEMU boot tests (build only)"
        required: false
        default: "false"
      reuse_iso:
        description: "skip build, test the ISO artifact from a previous run"
        required: false
        default: "false"
      source_run_id:
        description: "run id that uploaded bnasec-iso-untested (required when reuse_iso=true)"
        required: false
        default: ""
      publish:
        description: "publish release v2.0.0 when tests pass (set false for test/screenshot reruns)"
        required: false
        default: "true"

permissions:
  contents: write
  # actions:read is required by download-artifact@v4 run-id (cross-run download)
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: archlinux:base-devel
      # bind-mount the runner's big secondary disk: mkarchiso's pacstrap (~7GB),
      # the ISO (~2.5GB) and the boot-test images do not fit next to the container
      # and the 1.4GB profile home on the workspace filesystem (run 36140211038:
      # "Partition /__w too full: 1574201 blocks needed, 402977 blocks free")
      options: --privileged --volume /mnt/bnasec-ci:/mnt/bnasec-ci
    env:
      PROFILE_DIR: ${{ github.workspace }}/profile
      WORK_DIR: /mnt/bnasec-ci/work
      OUT_DIR: /mnt/bnasec-ci/out
      TEST_DIR: /mnt/bnasec-ci/tests
      GH_TOKEN: ${{ github.token }}
      TERM: xterm-256color
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install build + test tooling
        run: |
          pacman -Syu --noconfirm
          # qemu + ovmf are installed later by ci/boot-tests.sh — the build phase
          # needs every MB of the ~14GB runner SSD
          pacman -S --noconfirm --needed archiso git jq github-cli

      - name: build ISO (ML4W baked in)
        if: ${{ inputs.reuse_iso != 'true' }}
        run: bash ci/build-iso.sh

      - name: reuse ISO artifact from previous run
        if: ${{ inputs.reuse_iso == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: bnasec-iso-untested
          path: ${{ env.OUT_DIR }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: boot tests (BIOS / persistence proof / RAM-only / UEFI)
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: bash ci/boot-tests.sh

      - name: collect diagnostics
        if: always()
        run: |
          mkdir -p diag
          cp -v "$TEST_DIR"/*.log diag/ 2>/dev/null || true
          cp -v /tmp/hyde-install.log diag/ 2>/dev/null || true
          cp -v /tmp/pkg-install.log diag/ 2>/dev/null || true
          cp -v /tmp/purge.log diag/ 2>/dev/null || true
          cp -v /tmp/keep-pkgs.txt diag/ 2>/dev/null || true
          cp -v /tmp/mkarchiso.log diag/ 2>/dev/null || true
          # boot-test VGA screenshots (png) — visual proof of the ISO in QEMU
          mkdir -p diag/screenshots
          cp -v "$TEST_DIR"/shots/*.png diag/screenshots/ 2>/dev/null || true
          ls -la "$OUT_DIR" || true

      - name: upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bnasec-diag
          path: diag/
          if-no-files-found: ignore

      - name: upload ISO artifact (for failed runs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bnasec-iso-untested
          path: ${{ env.OUT_DIR }}/*.iso
          retention-days: 3

      - name: publish release v2.0.0
        if: ${{ success() && github.event.inputs.skip_tests != 'true' && inputs.publish != 'false' }}
        run: |
          ISO=$(find "$OUT_DIR" -maxdepth 1 -name '*.iso' | head -1)
          SHAFILE="$OUT_DIR/$(basename "$ISO").sha256"
          sha256sum "$ISO" > "$SHAFILE"
          SHA=$(awk '{print $1}' "$SHAFILE")
          SIZE=$(du -h "$ISO" | cut -f1)
          cat > release-notes.md <<EOF
          # bnasec-arch 2.0.0 — rebuilt from scratch: Arch + Hyprland + ML4W

          Complete rebuild on user request: v1.2.x's HyDE desktop replaced by the
          [ML4W dotfiles 2.16](https://github.com/mylinuxforwork/dotfiles) — the
          Quickshell status bar, dock, settings app and wallpaper switcher look.
          ISO trimmed to ~1.6GB (was 2GB).

          ## What changed in 2.0.0
          - **ML4W desktop baked in**: Quickshell status bar (top), dock (bottom), ML4W Settings app, Quickshell Overview, Welcome app, matugen theming, awww wallpapers — all preinstalled; first boot lands on the finished desktop with the default wallpaper pre-applied
          - **No display manager at all**: getty autologins as `bna` on tty1 and .zprofile starts Hyprland via uwsm — the entire X11-greeter black-screen bug class from 1.2.0/1.2.1 is structurally gone
          - **Selective persistence (the big one)**: the root filesystem is now ALWAYS volatile — packages reset to ISO state every boot, so package rot like the 1.1.x stick is physically impossible. What persists is exactly: `~/.mozilla` (Firefox profiles/storage), `~/.config` (ML4W/Hyprland settings + wallpaper state), `~/.local/share` (app data), `~/Documents`, `~/Downloads`, `~/Pictures` — bind-mounted from the stick's ext4 `persistence` partition (auto-created on first boot, fsck'd every boot, no root reserve)
          - **RAM-only menu entry** (`bnasec_nopersist`) never touches the stick
          - **AMD GPU firmware** (linux-firmware-amdgpu) + all wifi firmware kept

          ## Apps shipped
          firefox, kitty, thunar, rofi, wlogout, swaync, fastfetch, btop, loupe, grimblast (screenshots), cliphist, network/bluetooth applets, pipewire audio, zsh + ohmyposh, quickshell + matugen + awww (ML4W engine)

          ## Verified in CI (QEMU)
          - BIOS boot from dd'd USB image: data partition auto-created, volatile overlay root, .config bound from stick, Hyprland session answering
          - Selective persistence proof: markers in `~/.config` AND `~/Documents` read back after a full reboot
          - RAM-only session boots volatile, stick untouched
          - UEFI boot verified via OVMF

          ## Login
          - Autologins into Hyprland as `bna` on boot; password `bnasec` (sudo: same)

          ## Flash
          ```bash
          sha256sum bnasec-arch-2.0.0-x86_64.iso
          # expected: $SHA
          sudo dd if=bnasec-arch-2.0.0-x86_64.iso of=/dev/sdX bs=4M status=progress oflag=sync
          ```
          ISO size: $SIZE. A 4 GB+ stick is enough; the rest becomes your data partition.
          EOF
          gh release delete --repo "$GITHUB_REPOSITORY" v2.0.0 --yes --cleanup-tag 2>/dev/null || true
          # --repo: gh otherwise shells out to git for repo discovery, and the
          # workspace bind-mount boundary in the container breaks it
          # ('fatal: not a git repository ... up to mount point /')
          gh release create --repo "$GITHUB_REPOSITORY" v2.0.0 "$ISO" "$SHAFILE" \
            --title "bnasec-arch-2.0.0 — ML4W desktop + selective persistence" \
            --notes-file release-notes.md
          echo "released:"
          gh release view --repo "$GITHUB_REPOSITORY" v2.0.0 --json assets --jq '.assets[].name'
