name: build-bnasec-iso

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "skip QEMU boot tests (build only)"
        required: false
        default: "false"
      reuse_iso:
        description: "skip build, test the ISO artifact from a previous run"
        required: false
        default: "false"
      source_run_id:
        description: "run id that uploaded bnasec-iso-untested (required when reuse_iso=true)"
        required: false
        default: ""
      publish:
        description: "publish release v2.0.1 when tests pass (set false for test/screenshot reruns)"
        required: false
        default: "true"

permissions:
  contents: write
  # actions:read is required by download-artifact@v4 run-id (cross-run download)
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: archlinux:base-devel
      # bind-mount the runner's big secondary disk: mkarchiso's pacstrap (~7GB),
      # the ISO (~2.5GB) and the boot-test images do not fit next to the container
      # and the 1.4GB profile home on the workspace filesystem (run 36140211038:
      # "Partition /__w too full: 1574201 blocks needed, 402977 blocks free")
      options: --privileged --volume /mnt/bnasec-ci:/mnt/bnasec-ci
    env:
      PROFILE_DIR: ${{ github.workspace }}/profile
      WORK_DIR: /mnt/bnasec-ci/work
      OUT_DIR: /mnt/bnasec-ci/out
      TEST_DIR: /mnt/bnasec-ci/tests
      GH_TOKEN: ${{ github.token }}
      TERM: xterm-256color
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install build + test tooling
        run: |
          pacman -Syu --noconfirm
          # qemu + ovmf are installed later by ci/boot-tests.sh — the build phase
          # needs every MB of the ~14GB runner SSD
          pacman -S --noconfirm --needed archiso git jq github-cli

      - name: build ISO (ML4W baked in)
        if: ${{ inputs.reuse_iso != 'true' }}
        run: bash ci/build-iso.sh

      - name: reuse ISO artifact from previous run
        if: ${{ inputs.reuse_iso == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: bnasec-iso-untested
          path: ${{ env.OUT_DIR }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: boot tests (BIOS / persistence proof / RAM-only / UEFI)
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: bash ci/boot-tests.sh

      - name: collect diagnostics
        if: always()
        run: |
          mkdir -p diag
          cp -v "$TEST_DIR"/*.log diag/ 2>/dev/null || true
          cp -v /tmp/hyde-install.log diag/ 2>/dev/null || true
          cp -v /tmp/pkg-install.log diag/ 2>/dev/null || true
          cp -v /tmp/purge.log diag/ 2>/dev/null || true
          cp -v /tmp/keep-pkgs.txt diag/ 2>/dev/null || true
          cp -v /tmp/mkarchiso.log diag/ 2>/dev/null || true
          # boot-test VGA screenshots (png) — visual proof of the ISO in QEMU
          mkdir -p diag/screenshots
          cp -v "$TEST_DIR"/shots/*.png diag/screenshots/ 2>/dev/null || true
          ls -la "$OUT_DIR" || true

      - name: upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bnasec-diag
          path: diag/
          if-no-files-found: ignore

      - name: upload ISO artifact (for failed runs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bnasec-iso-untested
          path: ${{ env.OUT_DIR }}/*.iso
          retention-days: 3

      - name: publish release v3.0.0
        if: ${{ success() && github.event.inputs.skip_tests != 'true' && inputs.publish != 'false' }}
        run: |
          ISO=$(find "$OUT_DIR" -maxdepth 1 -name '*.iso' | head -1)
          SHAFILE="$OUT_DIR/$(basename "$ISO").sha256"
          sha256sum "$ISO" > "$SHAFILE"
          SHA=$(awk '{print $1}' "$SHAFILE")
          SIZE=$(du -h "$ISO" | cut -f1)
          cat > release-notes.md <<EOF
          # bnasec-arch 3.0.0 — the panel fix, PROVEN: packages persist now

          Full rebuild of the desktop session + persistence. Every component of
          this release was verified in a booted virtual machine — including
          screenshots of the actual desktop — before publishing.

          ## Why the panel never appeared (proven from ML4W 2.16 source)
          1. **qt6-5compat was never shipped.** ML4W's shell.qml instantiates
             WallpaperWindow, which imports Qt5Compat.GraphicalEffects. The
             module lives in qt6-5compat — not a quickshell dependency and not
             in the package list. The QML engine failed the import inside the
             shell root, so \`qs\` aborted on EVERY boot, on EVERY machine.
             No exec-bit fix could ever cure this.
          2. **~/.mydotfiles never existed.** autostart.lua redirects the whole
             session chain log into ~/.mydotfiles/ml4w-autostart.log — a
             directory the dotfiles do not ship. The redirect failed and
             ml4w-autostart never ran at all.
          3. **Nothing verified anything.** A bar that dies silently stays
             invisible. Now every launch is followed by a liveness check.

          ## What 3.0.0 does instead
          - **bnasec-session**: starts quickshell, VERIFIES it stays alive,
            retries with software rendering, falls back to a waybar bar
            (ML4W glass theme), and writes a verdict to
            ~/.config/bnasec/verdict either way. The dock, overview and
            settings panel start only once the bar is confirmed up.
          - **PERSISTENCE UPGRADE — installs survive reboots.** The default
            boot entry now runs the root as an overlay whose upperdir lives
            on the stick's data partition (cow_label=persistence). Install
            anything — it is still there after reboot. User data (Firefox,
            config, Documents...) keeps persisting as before. Boot menu
            entries: persistent (default), data-only persistence, RAM-only,
            verbose debug.
          - **qt6-5compat baked in** + a build-time QML import audit that
            fails the build if any baked .qml imports a Qt module that is
            not shipped — this bug class can never ship again.
          - **bnasec-bar**: Super+Ctrl+B flips quickshell <-> waybar;
            \`bnasec-bar status|quickshell|waybar|switch|restart\` from a terminal.
          - **bnasec-space watchdog**: warns on-screen when the persistence
            partition runs low (it now holds packages too).
          - **ssh control channel (opt-in)**: sshd runs key-only with NO keys
            by default (nobody gets in). Booting with
            bnasec.sshkey="<your pubkey>" installs that key for the session.
          - sudo is now passwordless for the live user (bna / bnasec).
          - oh-my-zsh, eza and fzf are baked into the stick's persistent
            config (fixed for real this time — verified in the boot tests).

          ## Tested before shipping (all in a real booted VM)
          - BIOS + UEFI boot, RAM-only mode, auto-created persistence partition
          - the bar verdict (BAR=quickshell) and a grim screenshot of the live
            desktop with the panel visible
          - zsh/oh-my-zsh, eza/fzf ls, kitty, firefox, network, pipewire audio
          - the heavy persistence tour: space check -> libreoffice-fresh
            installed into the persistent root + 1 GB file written ->
            REBOOT -> package still installed, soffice still runs,
            1 GB file byte-identical (sha256), space consistent

          ## Flash
          \`\`\`bash
          sha256sum bnasec-arch-3.0.0-x86_64.iso
          # expected: $SHA
          sudo dd if=bnasec-arch-3.0.0-x86_64.iso of=/dev/sdX bs=4M status=progress oflag=sync
          \`\`\`
          ISO size: $SIZE. Use a 4 GB+ stick; the free space becomes your
          persistence partition on first boot. User: bna, password: bnasec,
          autologin, sudo open. If the bar ever dies: Super+Ctrl+B, or
          \`bnasec-bar switch\`, and read ~/.config/bnasec/verdict.
          EOF
          gh release delete --repo "$GITHUB_REPOSITORY" v3.0.0 --yes --cleanup-tag 2>/dev/null || true
          # --repo: gh otherwise shells out to git for repo discovery, and the
          # workspace bind-mount boundary in the container breaks it
          # ('fatal: not a git repository ... up to mount point /')
          gh release create --repo "$GITHUB_REPOSITORY" v3.0.0 "$ISO" "$SHAFILE" \
            --title "bnasec-arch-3.0.0 — panel root-cause fix + persistent installs" \
            --notes-file release-notes.md
          echo "released:"
          gh release view --repo "$GITHUB_REPOSITORY" v3.0.0 --json assets --jq '.assets[].name'
