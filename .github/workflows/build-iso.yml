name: build-bnasec-iso

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "skip QEMU boot tests (build only)"
        required: false
        default: "false"
      reuse_iso:
        description: "skip build, test the ISO artifact from a previous run"
        required: false
        default: "false"
      source_run_id:
        description: "run id that uploaded bnasec-iso-untested (required when reuse_iso=true)"
        required: false
        default: ""
      publish:
        description: "publish release v2.0.1 when tests pass (set false for test/screenshot reruns)"
        required: false
        default: "true"

permissions:
  contents: write
  # actions:read is required by download-artifact@v4 run-id (cross-run download)
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: archlinux:base-devel
      # bind-mount the runner's big secondary disk: mkarchiso's pacstrap (~7GB),
      # the ISO (~2.5GB) and the boot-test images do not fit next to the container
      # and the 1.4GB profile home on the workspace filesystem (run 36140211038:
      # "Partition /__w too full: 1574201 blocks needed, 402977 blocks free")
      options: --privileged --volume /mnt/bnasec-ci:/mnt/bnasec-ci
    env:
      PROFILE_DIR: ${{ github.workspace }}/profile
      WORK_DIR: /mnt/bnasec-ci/work
      OUT_DIR: /mnt/bnasec-ci/out
      TEST_DIR: /mnt/bnasec-ci/tests
      GH_TOKEN: ${{ github.token }}
      TERM: xterm-256color
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install build + test tooling
        run: |
          pacman -Syu --noconfirm
          # qemu + ovmf are installed later by ci/boot-tests.sh — the build phase
          # needs every MB of the ~14GB runner SSD
          pacman -S --noconfirm --needed archiso git jq github-cli

      - name: build ISO (ML4W baked in)
        if: ${{ inputs.reuse_iso != 'true' }}
        run: bash ci/build-iso.sh

      - name: reuse ISO artifact from previous run
        if: ${{ inputs.reuse_iso == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: bnasec-iso-untested
          path: ${{ env.OUT_DIR }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: boot tests (BIOS / persistence proof / RAM-only / UEFI)
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: bash ci/boot-tests.sh

      - name: collect diagnostics
        if: always()
        run: |
          mkdir -p diag
          cp -v "$TEST_DIR"/*.log diag/ 2>/dev/null || true
          cp -v /tmp/hyde-install.log diag/ 2>/dev/null || true
          cp -v /tmp/pkg-install.log diag/ 2>/dev/null || true
          cp -v /tmp/purge.log diag/ 2>/dev/null || true
          cp -v /tmp/keep-pkgs.txt diag/ 2>/dev/null || true
          cp -v /tmp/mkarchiso.log diag/ 2>/dev/null || true
          # boot-test VGA screenshots (png) — visual proof of the ISO in QEMU
          mkdir -p diag/screenshots
          cp -v "$TEST_DIR"/shots/*.png diag/screenshots/ 2>/dev/null || true
          ls -la "$OUT_DIR" || true

      - name: upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bnasec-diag
          path: diag/
          if-no-files-found: ignore

      - name: upload ISO artifact (for failed runs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bnasec-iso-untested
          path: ${{ env.OUT_DIR }}/*.iso
          retention-days: 3

      - name: publish release v2.0.1
        if: ${{ success() && github.event.inputs.skip_tests != 'true' && inputs.publish != 'false' }}
        run: |
          ISO=$(find "$OUT_DIR" -maxdepth 1 -name '*.iso' | head -1)
          SHAFILE="$OUT_DIR/$(basename "$ISO").sha256"
          sha256sum "$ISO" > "$SHAFILE"
          SHA=$(awk '{print $1}' "$SHAFILE")
          SIZE=$(du -h "$ISO" | cut -f1)
          cat > release-notes.md <<EOF
          # bnasec-arch 2.0.1 — ML4W desktop: autostart exec-bit fix

          Hotfix on top of 2.0.0: on real hardware the desktop came up as a bare
          black screen with only a cursor — no bar, no dock, no wallpaper.

          ## Root cause
          mkarchiso bakes every profile file with mode 644 ('cp -af
          --no-preserve=mode'). The ML4W dotfiles ship ~90 runtime scripts that
          Hyprland execs DIRECTLY (ml4w-autostart, listeners.sh, gtk.sh,
          waybar launch.sh, ...). Stripped to 644, every autostart item died
          with 'Permission denied' — the compositor itself (a package binary)
          still ran, hiding the damage. 2.0.0 only restored 3 exact paths via
          profiledef file_permissions; enumerating 91 paths that way is not
          maintainable.

          ## The fix
          - new bnasec-fixmodes.service (runs every boot, After=bnasec-persist):
            restores +x on the whole ML4W script tree and companion launchers,
            self-verifies (PASS line on console), and because it runs after the
            persist bind, the fix is written through to the stick — one boot of
            2.0.1 permanently repairs a stick first seeded by 2.0.0
          - new CI test T1i fails the build if the autostart chain is not
            executable in a real guest boot (regression guard)

          Everything else is identical to 2.0.0: same package set, same size
          class (~1.7GB), same selective persistence (Firefox, config, app
          data, Documents/Downloads/Pictures), same boot menu.

          ## Flash
          ```bash
          sha256sum bnasec-arch-2.0.1-x86_64.iso
          # expected: $SHA
          sudo dd if=bnasec-arch-2.0.1-x86_64.iso of=/dev/sdX bs=4M status=progress oflag=sync
          ```
          ISO size: $SIZE. A 4 GB+ stick is enough; the rest becomes your data partition.
          EOF
          gh release delete --repo "$GITHUB_REPOSITORY" v2.0.1 --yes --cleanup-tag 2>/dev/null || true
          # --repo: gh otherwise shells out to git for repo discovery, and the
          # workspace bind-mount boundary in the container breaks it
          # ('fatal: not a git repository ... up to mount point /')
          gh release create --repo "$GITHUB_REPOSITORY" v2.0.1 "$ISO" "$SHAFILE" \
            --title "bnasec-arch-2.0.1 — cursor-only desktop fix (exec bits)" \
            --notes-file release-notes.md
          echo "released:"
          gh release view --repo "$GITHUB_REPOSITORY" v2.0.1 --json assets --jq '.assets[].name'
